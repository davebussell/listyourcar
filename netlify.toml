# Netlify configuration for listyourcar.ca
# Static site — no build step. Files are served from the repo root.

[build]
  publish = "."
  command = ""

# Friendly redirect: /rent → browse rentals (matches strategy's /rent channel)
[[redirects]]
  from = "/rent"
  to = "/browse.html?intent=rental"
  status = 302

# Legacy path from the original sell-only build
[[redirects]]
  from = "/sell"
  to = "/list.html"
  status = 301

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# CSS/JS change often in this prototype — revalidate each load (cheap 304
# via ETag) so updates go live immediately instead of being cached for a day.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
