# Netlify configuration for listyourcar.ca
# Static site — no build step. Files are served from the repo root.

[build]
  publish = "."
  command = ""

# Short paths for the two things people are actually here to do.
[[redirects]]
  from = "/sell"
  to = "/sell.html"
  status = 301

[[redirects]]
  from = "/value"
  to = "/value.html"
  status = 301

# Retired products. These pointed at pages that no longer exist —
# browse.html and list.html were the shoot-rental build.
[[redirects]]
  from = "/rent"
  to = "/sell.html"
  status = 301

[[redirects]]
  from = "/browse.html"
  to = "/auctions.html"
  status = 301

[[redirects]]
  from = "/list.html"
  to = "/sell.html"
  status = 301

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# CSS/JS change often in this prototype — revalidate each load (cheap 304
# via ETag) so updates go live immediately instead of being cached for a day.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The dealer network is large and changes only when rebuilt. Cache it
# hard; the version query on the fetch busts it when it does change.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Vehicle photos are content-addressed by filename and never mutate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
